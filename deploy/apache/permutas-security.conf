# Include INSIDE the HTTPS VirtualHost for permutas.eii.us.es.
# Requires mod_headers. Do not copy directly into conf.d (global scope).
# Keep the existing certificate, HSTS, proxy and SAML configuration.

ServerSignature Off
TraceEnable Off
SSLProtocol -all +TLSv1.2 +TLSv1.3

# Clear both Apache header tables to avoid duplicate/conflicting headers.
Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"
Header onsuccess unset X-Frame-Options
Header always set X-Frame-Options "DENY"
Header onsuccess unset Referrer-Policy
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header onsuccess unset Permissions-Policy
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header onsuccess unset X-Powered-By
Header always unset X-Powered-By

# Apply to the SPA, not to API-generated HTML/SAML or PDF responses.
# This adds a minimal enforced policy; it must not replace a stricter policy.
<LocationMatch "^/(?!api/|auth/|dlga-api(?:/|$)|assets/|\.well-known/)">
    Header always add Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
    # Candidate policy: inspect violations before enforcing. No report endpoint
    # is configured, so reports stay in the browser developer console.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net/gh/ctt-gob-es/clienteafirma@fe60ef3fdbae3c491e97c262a2179e2787b85776/afirma-ui-miniapplet-deploy/src/main/webapp/js/autoscript.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://127.0.0.1:* wss://127.0.0.1:* https://localhost:* wss://localhost:*; frame-src 'self' blob: afirma:; form-action 'self'"
</LocationMatch>

# API responses can contain personal data, documents and session tokens.
<Location "/api/">
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
</Location>

# Never expose repository metadata, secrets, source trees or development APIs.
# /dlga-api itself is not denied: inspect existing legitimate proxy use first.
<LocationMatch "(?i)(?:^|/)(?:\.git|\.env[^/]*|\.npmrc|\.agents|\.codex)(?:/|$)|^/(?:node_modules|src|@vite|@fs|@id|__vitest__)(?:/|$)|^/(?:package(?:-lock)?\.json|vite\.config\.[^/]+)$">
    Require all denied
</LocationMatch>
